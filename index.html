<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chinese Culture Spin & Learn!</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --red:    #C0392B;
    --red2:   #E74C3C;
    --gold:   #F1C40F;
    --gold2:  #E67E22;
    --dark:   #1a0a00;
    --cream:  #FFF8EE;
    --ink:    #2C1A0E;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--dark);
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
      radial-gradient(circle at 10% 20%, rgba(192,57,43,0.18) 0%, transparent 50%),
      radial-gradient(circle at 90% 80%, rgba(241,196,15,0.12) 0%, transparent 50%);
  }

  /* Decorative lanterns */
  .lanterns {
    position: fixed; top: 0; left: 0; width: 100%; pointer-events: none; z-index: 0;
    display: flex; justify-content: space-between; padding: 0 2rem;
  }
  .lantern {
    width: 28px; height: 44px; border-radius: 50%; position: relative;
    animation: sway 3s ease-in-out infinite;
  }
  .lantern::before {
    content: '';
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    width: 2px; height: 12px; background: var(--gold);
  }
  .lantern::after {
    content: '';
    position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
    width: 1px; height: 8px; background: var(--gold);
  }
  .lantern:nth-child(odd) { background: radial-gradient(circle at 40% 40%, #ff6b6b, var(--red)); animation-delay: -1.5s; }
  .lantern:nth-child(even) { background: radial-gradient(circle at 40% 40%, #ffe56b, var(--gold2)); }
  @keyframes sway { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(8deg)} }

  header {
    position: relative; z-index: 1;
    text-align: center; padding: 2rem 1rem 0.5rem;
  }
  header h1 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2rem, 5vw, 3.5rem);
    color: var(--gold);
    text-shadow: 3px 3px 0 var(--red), 5px 5px 0 rgba(0,0,0,0.4);
    letter-spacing: 2px;
  }
  header p {
    color: #ffd580;
    font-size: 1.1rem;
    margin-top: 0.4rem;
    font-weight: 600;
  }
  .chinese-char {
    font-family: 'Noto Serif SC', serif;
    font-size: 1.8rem;
    color: rgba(241,196,15,0.5);
    letter-spacing: 0.5rem;
    display: block;
    margin-top: 0.2rem;
  }

  main {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    padding: 1rem;
    gap: 1.5rem;
  }

  .wheel-area {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
  }

  /* Pointer arrow */
  .pointer {
    width: 0; height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 36px solid var(--gold);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    position: relative; z-index: 5;
    margin-bottom: -4px;
  }

  .wheel-frame {
    width: min(440px, 92vw); height: min(440px, 92vw);
    border-radius: 50%;
    padding: 10px;
    background: conic-gradient(var(--gold), var(--gold2), var(--gold), var(--gold2));
    box-shadow: 0 0 40px rgba(241,196,15,0.4), 0 0 80px rgba(192,57,43,0.3), inset 0 0 20px rgba(0,0,0,0.2);
    position: relative;
  }

  canvas {
    border-radius: 50%;
    display: block;
    cursor: pointer;
    width: 100%; height: 100%;
    transition: filter 0.3s;
  }
  canvas:hover { filter: brightness(1.05); }

  /* Center hub */
  .hub {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 64px; height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffe566, var(--gold2));
    border: 4px solid var(--red);
    box-shadow: 0 0 16px rgba(241,196,15,0.6);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Noto Serif SC', serif;
    font-size: 1.6rem;
    color: var(--red);
    z-index: 10; pointer-events: none;
    user-select: none;
  }

  .spin-btn {
    font-family: 'Fredoka One', cursive;
    font-size: 1.4rem;
    padding: 0.75rem 2.8rem;
    border-radius: 50px;
    border: 3px solid var(--gold);
    background: linear-gradient(135deg, var(--red2), var(--red));
    color: var(--gold);
    cursor: pointer;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
    box-shadow: 0 6px 20px rgba(192,57,43,0.5), 0 2px 0 rgba(0,0,0,0.3);
    transition: transform 0.15s, box-shadow 0.15s;
    letter-spacing: 1px;
  }
  .spin-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(192,57,43,0.6); }
  .spin-btn:active { transform: translateY(1px); box-shadow: 0 3px 10px rgba(192,57,43,0.4); }
  .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Score strip */
  .score-strip {
    display: flex; gap: 2rem; align-items: center;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(241,196,15,0.25);
    border-radius: 50px;
    padding: 0.5rem 2rem;
  }
  .score-item { text-align: center; }
  .score-item .val {
    display: block;
    font-family: 'Fredoka One', cursive;
    font-size: 1.8rem;
    color: var(--gold);
    line-height: 1;
  }
  .score-item .lbl {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: rgba(255,200,80,0.6);
    font-weight: 700;
  }
  .divider { width: 1px; height: 36px; background: rgba(241,196,15,0.25); }

  /* MODAL */
  .modal-bg {
    display: none;
    position: fixed; inset: 0;
    background: rgba(10,3,0,0.88);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: center; justify-content: center;
    padding: 1rem;
  }
  .modal-bg.show { display: flex; }

  .modal {
    background: linear-gradient(160deg, #2a0e04, #1a0800);
    border: 3px solid var(--gold);
    border-radius: 24px;
    max-width: 520px; width: 100%;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(241,196,15,0.25), 0 30px 80px rgba(0,0,0,0.8);
    animation: popIn 0.35s cubic-bezier(.175,.885,.32,1.275) both;
  }
  @keyframes popIn { from{transform:scale(0.7) translateY(20px);opacity:0} to{transform:scale(1);opacity:1} }

  .modal-header {
    background: linear-gradient(135deg, var(--red), #8b1a10);
    padding: 1.2rem 1.5rem;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 2px solid var(--gold);
  }
  .modal-header .q-tag {
    font-family: 'Fredoka One', cursive;
    font-size: 0.85rem;
    color: var(--gold);
    letter-spacing: 1px;
    text-transform: uppercase;
    background: rgba(0,0,0,0.25);
    padding: 2px 10px;
    border-radius: 20px;
  }
  .modal-close {
    background: none; border: none;
    color: var(--gold); font-size: 1.5rem;
    cursor: pointer; padding: 0 4px;
    line-height: 1;
    transition: transform 0.2s;
  }
  .modal-close:hover { transform: scale(1.2) rotate(90deg); }

  .modal-body { padding: 1.5rem; }

  .question-text {
    font-size: 1.3rem;
    font-weight: 800;
    color: #ffe8b0;
    line-height: 1.4;
    margin-bottom: 1.2rem;
    text-align: center;
  }

  .choices { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1.2rem; }

  .choice-btn {
    background: rgba(255,255,255,0.05);
    border: 1.5px solid rgba(241,196,15,0.3);
    border-radius: 12px;
    padding: 0.7rem 1rem;
    color: #ffdfa0;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    text-align: left;
    display: flex; align-items: center; gap: 0.75rem;
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
  }
  .choice-btn:not(.locked):hover {
    background: rgba(241,196,15,0.12);
    border-color: var(--gold);
    transform: translateX(4px);
  }
  .choice-btn .letter {
    min-width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(241,196,15,0.15);
    border: 1.5px solid rgba(241,196,15,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; font-weight: 800;
    color: var(--gold);
    flex-shrink: 0;
  }
  .choice-btn.correct {
    background: rgba(46,213,115,0.18);
    border-color: #2ed573;
  }
  .choice-btn.correct .letter { background: #2ed573; color: #000; border-color: #2ed573; }
  .choice-btn.wrong {
    background: rgba(255,71,87,0.18);
    border-color: #ff4757;
  }
  .choice-btn.wrong .letter { background: #ff4757; color: #fff; border-color: #ff4757; }

  .fun-fact {
    background: rgba(241,196,15,0.08);
    border-left: 3px solid var(--gold);
    border-radius: 0 12px 12px 0;
    padding: 0.8rem 1rem;
    color: #ffd580;
    font-size: 0.95rem;
    line-height: 1.5;
    margin-bottom: 1.2rem;
    display: none;
  }
  .fun-fact.show { display: block; }
  .fun-fact strong { display: block; margin-bottom: 0.2rem; font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase; color: var(--gold); }

  .next-btn {
    width: 100%;
    font-family: 'Fredoka One', cursive;
    font-size: 1.2rem;
    padding: 0.75rem;
    border-radius: 12px;
    border: 2px solid var(--gold);
    background: linear-gradient(135deg, var(--gold2), #c0700d);
    color: #fff;
    cursor: pointer;
    letter-spacing: 1px;
    transition: filter 0.2s, transform 0.15s;
    display: none;
  }
  .next-btn.show { display: block; }
  .next-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }

  /* Confetti (simple CSS) */
  .confetti-wrap {
    position: fixed; inset: 0; pointer-events: none; z-index: 200; overflow: hidden;
  }
  .confetto {
    position: absolute;
    width: 10px; height: 10px;
    top: -12px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* Footer */
  footer {
    position: relative; z-index: 1;
    text-align: center;
    padding: 1.5rem;
    color: rgba(255,200,80,0.3);
    font-size: 0.8rem;
  }

  /* Answered indicators */
  .answered-dots {
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 300px;
  }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 1.5px solid rgba(241,196,15,0.2);
    transition: background 0.3s, border-color 0.3s;
  }
  .dot.done { background: var(--gold2); border-color: var(--gold); }
  .dot.correct { background: #2ed573; border-color: #2ed573; }
  .dot.wrong { background: #ff4757; border-color: #ff4757; }
</style>
</head>
<body>

<div class="lanterns">
  <div class="lantern"></div>
  <div class="lantern"></div>
  <div class="lantern"></div>
  <div class="lantern"></div>
  <div class="lantern"></div>
  <div class="lantern"></div>
  <div class="lantern"></div>
</div>

<div class="confetti-wrap" id="confettiWrap"></div>

<header>
  <h1>🐉 Spin &amp; Learn! 🐉</h1>
  <p>Chinese Culture Quiz</p>
  <span class="chinese-char">文化 知识 趣味</span>
</header>

<main>

  <div class="score-strip">
    <div class="score-item">
      <span class="val" id="scoreVal">0</span>
      <span class="lbl">Score</span>
    </div>
    <div class="divider"></div>
    <div class="score-item">
      <span class="val" id="askedVal">0</span>
      <span class="lbl">Asked</span>
    </div>
    <div class="divider"></div>
    <div class="score-item">
      <span class="val" id="leftVal">10</span>
      <span class="lbl">Left</span>
    </div>
  </div>

  <div class="wheel-area">
    <div class="pointer"></div>
    <div class="wheel-frame">
      <canvas id="wheel" width="420" height="420"></canvas>
      <div class="hub" aria-hidden="true">福</div>
    </div>
  </div>

  <button class="spin-btn" id="spinBtn" onclick="spinWheel()">🎰 SPIN!</button>

  <div class="answered-dots" id="dots"></div>

</main>

<footer>Made with ❤️ for Chinese Culture | Click SPIN to start!</footer>

<!-- Modal -->
<div class="modal-bg" id="modalBg" role="dialog" aria-modal="true" aria-labelledby="questionText">
  <div class="modal">
    <div class="modal-header">
      <span class="q-tag" id="qTag">Question 1 / 10</span>
      <button class="modal-close" onclick="closeModal()" aria-label="Close">✕</button>
    </div>
    <div class="modal-body">
      <p class="question-text" id="questionText"></p>
      <div class="choices" id="choices"></div>
      <div class="fun-fact" id="funFact">
        <strong>🌟 Fun Fact</strong>
        <span id="funFactText"></span>
      </div>
      <button class="next-btn" id="nextBtn" onclick="closeModal()">Spin Again! 🎡</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    q: "What is the longest wall ever built in history, mostly in China?",
    choices: ["The Great Wall", "Hadrian's Wall", "The Berlin Wall", "The Walls of Troy"],
    answer: 0,
    fact: "The Great Wall of China (万里长城) stretches over 13,000 miles! It was built over many centuries to protect China from invaders. You can see parts of it from space!"
  },
  {
    q: "Which animal is NOT part of the Chinese Zodiac?",
    choices: ["Dragon 🐉", "Cat 🐱", "Rooster 🐓", "Ox 🐂"],
    answer: 1,
    fact: "There's a legend that says the cat was tricked by the rat and missed the Jade Emperor's race — that's why it's not in the zodiac! The 12 animals are: Rat, Ox, Tiger, Rabbit, Dragon, Snake, Horse, Goat, Monkey, Rooster, Dog, and Pig."
  },
  {
    q: "What color is considered the luckiest in Chinese culture?",
    choices: ["Blue 🔵", "Purple 🟣", "Red 🔴", "Green 🟢"],
    answer: 2,
    fact: "Red (红色, hóng sè) symbolizes good luck, happiness, and prosperity in Chinese culture. That's why red envelopes filled with money (红包, hóngbāo) are given during Chinese New Year!"
  },
  {
    q: "What is the traditional Chinese sport that uses a small ball and paddles — and China wins almost every Olympic gold in it?",
    choices: ["Badminton", "Table Tennis (Ping Pong)", "Tennis", "Squash"],
    answer: 1,
    fact: "Table tennis (乒乓球) is China's national sport! China has won over 60 Olympic gold medals in it. The name 'ping pong' comes from the sound the ball makes — ping on offense, pong on defense!"
  },
  {
    q: "Chinese New Year is also officially called…?",
    choices: ["The Moon Festival", "Spring Festival", "Lantern Festival", "Dragon Boat Day"],
    answer: 1,
    fact: "Chinese New Year is officially called the Spring Festival (春节, Chūn Jié). It's the biggest holiday in China, celebrated with fireworks, dragon dances, family feasts, and lucky red envelopes!"
  },
  {
    q: "How many animals are in the Chinese Zodiac cycle?",
    choices: ["8", "10", "12", "16"],
    answer: 2,
    fact: "There are 12 animals, each representing a year in a repeating cycle. The cycle goes: Rat, Ox, Tiger, Rabbit, Dragon, Snake, Horse, Goat, Monkey, Rooster, Dog, and Pig. What year were you born in?"
  },
  {
    q: "What is 'dim sum'?",
    choices: [
      "A type of martial arts move",
      "Small bite-sized dishes served in steamer baskets",
      "A Chinese board game",
      "A type of silk embroidery"
    ],
    answer: 1,
    fact: "Dim sum (点心) means 'touch the heart' in Cantonese! It's a tradition of eating small dishes like dumplings, buns, and rolls — usually with tea. Going for dim sum is called 'yum cha' (饮茶), which means 'drink tea'!"
  },
  {
    q: "The panda is a national symbol of China 🐼. Where is the panda's only wild habitat?",
    choices: ["All of Asia", "Bamboo forests in China", "Himalayan mountains across Asia", "Tropical rainforests in southern China"],
    answer: 1,
    fact: "Giant pandas live only in a few mountain ranges in central China — mainly in Sichuan, Shaanxi, and Gansu provinces. They eat bamboo for up to 12 hours a day! China lends pandas to other countries as a sign of friendship, called 'Panda Diplomacy'."
  },
  {
    q: "What does the dragon (龙) represent in Chinese culture?",
    choices: [
      "Evil and danger ⚠️",
      "Death and the underworld",
      "Power, good luck, and prosperity 🌟",
      "The ocean and storms"
    ],
    answer: 2,
    fact: "Unlike Western dragons, Chinese dragons (龙, lóng) are symbols of GOOD luck, strength, and prosperity! Chinese emperors were called 'sons of the dragon' and wore dragon symbols on their robes. Dragon dances at festivals are meant to bring good fortune!"
  },
  {
    q: "Which ancient Chinese invention do we use EVERY SINGLE DAY to write, draw, and print?",
    choices: ["The compass", "Gunpowder", "Paper (and printing)", "Silk"],
    answer: 2,
    fact: "Paper was invented in China around 105 AD by a court official named Cai Lun! And the Chinese also invented woodblock printing and movable type — centuries before Gutenberg. China also invented the compass, gunpowder, and silk — four inventions that changed the world!"
  }
];

const COLORS = [
  '#C0392B','#E67E22','#F1C40F','#27AE60','#2980B9',
  '#8E44AD','#E74C3C','#D35400','#16A085','#1A5276'
];

const EMOJIS = ['🐉','🏮','🥢','🎋','🐼','🎴','🥟','🀄','🎎','📜'];

let angle = 0;
let spinning = false;
let answered = new Array(10).fill(null);
let score = 0;
let asked = 0;
let currentQ = -1;

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const NUM = 10;
const ARC = (Math.PI * 2) / NUM;

function drawWheel(rot) {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const r = cx - 4;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < NUM; i++) {
    const startAngle = rot + i * ARC;
    const endAngle = startAngle + ARC;

    // Wedge fill
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = answered[i] === true ? '#27AE60'
                  : answered[i] === false ? '#C0392B'
                  : COLORS[i];
    ctx.fill();

    // Wedge border
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Label
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startAngle + ARC / 2);

    // Question number
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.font = 'bold 28px Fredoka One, cursive';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(i + 1), r * 0.68, 1);
    ctx.fillStyle = '#fff';
    ctx.fillText(String(i + 1), r * 0.68, 0);

    // Emoji
    ctx.font = '22px serif';
    ctx.fillText(EMOJIS[i], r * 0.85, 0);

    ctx.restore();
  }

  // Outer ring
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 4;
  ctx.stroke();
}

function spinWheel() {
  if (spinning) return;
  const remaining = answered.map((v, i) => v === null ? i : -1).filter(i => i >= 0);
  if (remaining.length === 0) {
    showFinalScore();
    return;
  }

  spinning = true;
  document.getElementById('spinBtn').disabled = true;

  // Pick a random unanswered question
  const target = remaining[Math.floor(Math.random() * remaining.length)];

  // Calculate the rotation needed so target wedge lands at pointer (top)
  const wedgeMid = target * ARC + ARC / 2;
  const extraSpins = (3 + Math.floor(Math.random() * 3)) * Math.PI * 2;
  // We want (angle + totalRot + wedgeMid) ≡ -π/2 (mod 2π) so it points up
  const currentNorm = angle % (Math.PI * 2);
  let needed = -Math.PI / 2 - wedgeMid - currentNorm;
  needed = ((needed % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
  const totalRot = extraSpins + needed;

  let start = null;
  const duration = 3000 + Math.random() * 1000;

  function ease(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function animate(ts) {
    if (!start) start = ts;
    const elapsed = ts - start;
    const progress = Math.min(elapsed / duration, 1);
    const eased = ease(progress);

    angle = (angle + 0) % (Math.PI * 2);
    drawWheel(angle + eased * totalRot);

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      angle = (angle + totalRot) % (Math.PI * 2);
      drawWheel(angle);
      spinning = false;
      currentQ = target;
      setTimeout(() => openQuestion(target), 300);
    }
  }
  requestAnimationFrame(animate);
}

function openQuestion(idx) {
  const q = QUESTIONS[idx];
  asked++;

  document.getElementById('qTag').textContent = `Question ${asked} of 10`;
  document.getElementById('questionText').textContent = q.q;
  document.getElementById('funFact').classList.remove('show');
  document.getElementById('funFactText').textContent = q.fact;
  document.getElementById('nextBtn').classList.remove('show');

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.choices.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${choice}</span>`;
    btn.onclick = () => selectAnswer(idx, i, q.answer);
    choicesEl.appendChild(btn);
  });

  document.getElementById('modalBg').classList.add('show');
  updateStats();
}

function selectAnswer(qIdx, chosen, correct) {
  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach(b => b.classList.add('locked'));
  btns.forEach(b => { b.onclick = null; b.style.cursor = 'default'; });

  const isCorrect = chosen === correct;
  btns[chosen].classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) btns[correct].classList.add('correct');

  answered[qIdx] = isCorrect;
  if (isCorrect) {
    score++;
    triggerConfetti();
  }

  updateDots();
  updateStats();
  drawWheel(angle);

  document.getElementById('funFact').classList.add('show');
  document.getElementById('nextBtn').classList.add('show');
  document.getElementById('nextBtn').textContent =
    answered.filter(v => v === null).length === 0 ? 'See Final Score! 🏆' : 'Spin Again! 🎡';
}

function closeModal() {
  document.getElementById('modalBg').classList.remove('show');
  document.getElementById('spinBtn').disabled = false;
  updateStats();
  if (answered.filter(v => v === null).length === 0) {
    setTimeout(showFinalScore, 400);
  }
}

function updateStats() {
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('askedVal').textContent = asked;
  document.getElementById('leftVal').textContent = answered.filter(v => v === null).length;
}

function updateDots() {
  const dots = document.querySelectorAll('.dot');
  dots.forEach((d, i) => {
    d.classList.remove('done','correct','wrong');
    if (answered[i] === true) d.classList.add('correct');
    else if (answered[i] === false) d.classList.add('wrong');
  });
}

function triggerConfetti() {
  const wrap = document.getElementById('confettiWrap');
  const colors = ['#F1C40F','#E74C3C','#2ED573','#FF6B81','#fff','#E67E22'];
  for (let i = 0; i < 50; i++) {
    const c = document.createElement('div');
    c.className = 'confetto';
    const size = 6 + Math.random() * 8;
    c.style.cssText = `
      left:${Math.random()*100}%;
      width:${size}px; height:${size}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      border-radius:${Math.random() > 0.5 ? '50%' : '2px'};
      animation-duration:${1.5 + Math.random()*1.5}s;
      animation-delay:${Math.random()*0.5}s;
      opacity:1;
    `;
    wrap.appendChild(c);
    c.addEventListener('animationend', () => c.remove());
  }
}

function showFinalScore() {
  const pct = Math.round((score / 10) * 100);
  let msg, emoji;
  if (pct === 100) { msg = "Perfect Score! You're a Chinese Culture Master!"; emoji = "🏆🐉"; }
  else if (pct >= 80) { msg = "Amazing! You really know your Chinese culture!"; emoji = "🌟🏮"; }
  else if (pct >= 60) { msg = "Great job! Keep exploring Chinese culture!"; emoji = "👍🥟"; }
  else if (pct >= 40) { msg = "Good effort! There's so much more to discover!"; emoji = "🐼📚"; }
  else { msg = "Nice try! Chinese culture is deep and fascinating!"; emoji = "🎋🌸"; }

  document.getElementById('questionText').textContent = `${emoji} Final Score: ${score} / 10 — ${pct}%`;
  document.getElementById('qTag').textContent = "Quiz Complete!";
  document.getElementById('choices').innerHTML = `
    <div style="text-align:center; padding: 1rem 0;">
      <p style="color:#ffdfa0; font-size:1.05rem; font-weight:700; margin-bottom:0.5rem;">${msg}</p>
      <div style="display:flex; justify-content:center; gap:6px; flex-wrap:wrap; margin-top:0.8rem;">
        ${answered.map((v,i) => `<span style="font-size:1.5rem;">${v===true?'✅':'❌'}</span>`).join('')}
      </div>
    </div>`;
  document.getElementById('funFact').classList.remove('show');
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.textContent = '🔄 Play Again!';
  nextBtn.classList.add('show');
  nextBtn.onclick = resetGame;
  document.getElementById('modalBg').classList.add('show');
  triggerConfetti(); triggerConfetti();
}

function resetGame() {
  answered = new Array(10).fill(null);
  score = 0; asked = 0; currentQ = -1;
  angle = 0;
  updateStats();
  updateDots();
  drawWheel(0);
  document.getElementById('modalBg').classList.remove('show');
  document.getElementById('spinBtn').disabled = false;
  document.getElementById('nextBtn').onclick = closeModal;
}

// Build dots
(function buildDots() {
  const wrap = document.getElementById('dots');
  for (let i = 0; i < 10; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    d.title = `Question ${i+1}`;
    wrap.appendChild(d);
  }
})();

canvas.addEventListener('click', spinWheel);
drawWheel(0);
</script>
